name: Fix RiceGenixAI HTML rendering

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch HTML rendering
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          start = "st.markdown(\n        textwrap.dedent("
          end = "\n        ),\n        unsafe_allow_html=True,\n    )"

          pieces = []
          cursor = 0
          count = 0
          while True:
              begin = text.find(start, cursor)
              if begin < 0:
                  pieces.append(text[cursor:])
                  break
              finish = text.find(end, begin + len(start))
              if finish < 0:
                  pieces.append(text[cursor:])
                  break
              pieces.append(text[cursor:begin])
              block = text[begin:finish + len(end)]
              block = block.replace("st.markdown(", "st.html(", 1)
              block = block[:-len(end)] + "\n        )\n    )"
              pieces.append(block)
              cursor = finish + len(end)
              count += 1

          patched = "".join(pieces)
          if count:
              path.write_text(patched, encoding="utf-8")
              print(f"Converted {count} multiline custom HTML blocks to st.html.")
          else:
              print("No matching multiline HTML blocks found; nothing to change.")

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix custom HTML rendering in Streamlit UI"
          git push
